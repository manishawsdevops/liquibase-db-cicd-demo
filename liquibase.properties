databaseChangeLog:  
  - changeSet:  
      id: "1"  
      author: "your_name"  
      changes:  
        - createTable:  
            tableName: "your_table_name"  
            columns:  
              - column:  
                  name: "id"  
                  type: "int"  
                  constraints:  
                    primaryKey: true  
                    nullable: false  
              - column:  
                  name: "name"  
                  type: "varchar(255)"  
                  constraints:  
                    nullable: false  
              - column:  
                  name: "created_at"  
                  type: "timestamp"  
                  constraints:  
                    nullable: false  
                    defaultValueComputed: "CURRENT_TIMESTAMP"  

  - changeSet:  
      id: "2"  
      author: "your_name"  
      changes:  
        - insert:  
            tableName: "your_table_name"  
            columns:  
              - column:  
                  name: "id"  
                  value: "1"  
              - column:  
                  name: "name"  
                  value: "Sample Name"  
              - column:  
                  name: "created_at"  
                  valueDate: "2023-01-01T00:00:00Z"  

# Liquibase properties configuration
url: jdbc:your_database_url
username: your_username
password: your_password
changeLogFile: changelog/db.changelog-master.yaml